        <script>


function toggleMenu() {
    const menu = document.getElementById("navMenu");
    const hamburger = document.querySelector(".hamburger");

    const isActive = menu.classList.contains("active");
    menu.classList.toggle("active");
    hamburger.setAttribute("aria-expanded", String(!isActive));

    if (!isActive) {
        setTimeout(() => {
            document.addEventListener("click", closeMenuOnClickOutside);
        }, 0);
    } else {
        document.removeEventListener("click", closeMenuOnClickOutside);
    }
}

            function closeMenuOnClickOutside(event) {
                const menu = document.getElementById("navMenu");
                const hamburger = document.querySelector(".hamburger");

                if (!menu.contains(event.target) && !hamburger.contains(event.target)) {
                    menu.classList.remove("active");
                    document.removeEventListener("click", closeMenuOnClickOutside);
                }
            }

            function openGamePopup() {
    document.getElementById('gamePopup').style.display = 'block';
    document.getElementById('overlay').style.display = 'block';
}

function closeGamePopup() {
    document.getElementById('gamePopup').style.display = 'none';
    document.getElementById('overlay').style.display = 'none';
}

        </script>

<script>
    async function performSearch() {
        const ingredient = document.getElementById('ingredientInput').value;
        const resultsDiv = document.getElementById('results');
    
        if (!ingredient) {
            resultsDiv.innerHTML = '<p>Please enter some ingredients!</p>';
            return;
        }

        
    
        resultsDiv.innerHTML = '<p>Searching YouTube for recipes...</p>';
    
        const apiKey = 'AIzaSyDdA580dnQLxA2AOUevGffbLIV7RJZZlAc';  
        const searchQuery = `${ingredient} recipe`;
    
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&q=${encodeURIComponent(searchQuery)}&type=video&key=${apiKey}&maxResults=1`;
    
        try {
            const response = await fetch(url);
            const data = await response.json();
    
            if (data.items.length > 0) {
                const videoId = data.items[0].id.videoId;
                const videoTitle = data.items[0].snippet.title;
                const videoUrl = `https://www.youtube.com/watch?v=${videoId}`;
    
                resultsDiv.innerHTML = `
    <p>Here's a recipe video for <strong>${ingredient}</strong>:</p>
    <a href="${videoUrl}" target="_blank">${videoTitle}</a>
`;

            } else {
                resultsDiv.innerHTML = '<p>No recipe videos found. Try different ingredients!</p>';
            }
    
        } catch (error) {
            console.error(error);
            resultsDiv.innerHTML = '<p>Error fetching recipe video.</p>';
        }
    }
    </script>
    
<script>
    
    resultsDiv.innerHTML = '<p>Searching...</p>';

    fetch(`http://localhost:3000/recipes?q=${encodeURIComponent(ingredient)}`)
        .then(response => response.json())
        .then(data => {
            resultsDiv.innerHTML = ''; 

            if (data.length > 0) {
                data.forEach(recipe => {
                    const resultElement = document.createElement('div');
                    resultElement.innerHTML = `
                        <h3>${recipe.title}</h3>
                        <p><strong>Ingredients:</strong> ${recipe.ingredients.join(', ')}</p>
                        <p><strong>Instructions:</strong> ${recipe.instructions}</p>
                        <hr>
                    `;
                    resultsDiv.appendChild(resultElement);
                });
            } else {
                resultsDiv.innerHTML = '<p>No recipes found for this ingredient.</p>';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            resultsDiv.innerHTML = '<p>An error occurred while fetching the recipes.</p>';
        });


</script>
