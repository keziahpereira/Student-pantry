<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Chat - The Student Pantry</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Roboto', sans-serif;
}

body {
    background-image: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)),url('generator 2.jpg'); /* Replace with your image */ 
    background-size: cover;
    background-attachment: fixed;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    width: 100vw;
    padding-top: 60px;
    overflow-x: hidden;
}
.hamburger {
    position: fixed;
    top: 30px;
    left: 10px;
    font-size: 3.5em;
    z-index: 1100; 
    background: none;
    border: none;
    color: white;
    margin: 0; 
    padding: 0; 
}


.nav-menu {
    
    position: fixed;
    top: 90px; 
    left: 10px;
    z-index: 1000;
    background:  #506029;
    transition: opacity 0.3s ease, transform 0.3s ease;
    opacity: 0;
    transform: translateY(-10px);
    pointer-events: none;
    border-radius: 10px;
    padding: 20px; 
    display: flex;
    flex-direction: column;
    width: 250px; 
}

.nav-menu.active {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
}

.nav-menu a {
    color: #f0f8f0; 
    text-decoration: none; 
    padding: 10px 0; 
    font-size: 1.1em; 
    border-bottom: 1px solid rgba(255, 255, 255, 0.2); 
}

.nav-menu a.active-link {
    background-color: #e1e07f; 
    color: #364908; 
    font-weight: bold;
    border-radius: 5px;
    padding: 8px 10px;
}


.menu li {
  margin: 10px 0;
  border-bottom: 1px solid #cbdcb1; 
}

.menu li:last-child {
  border-bottom: none; 
}


.nav-menu a:hover {
    opacity: 0.8; 
}

/* Header Style */
header {
    color: white;
    text-align: center;
    padding: 20px;
    width: 100%;
}

header h1 {
    margin-bottom: 20px;
    font-size: 3.1em;
}

/* Instructions Style */
.instructions-container {
    background-color: rgb(35, 53, 5);
    color: #d8cb8d;
    padding: 20px;
    text-align: center;
    width: 90%;
    margin-top: 20px;
    border-radius: 10px;
}

.instructions-container p {
    font-size: 1.1em;
}

/* Chat Container */
.chat-container {
    width: 90%;
    max-width: 1400px;
    max-height: 90vh;
    background: rgb(193, 211, 164);
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(126, 184, 142, 0.925);
    margin: 20px 0;
    overflow: hidden;
}

.messages {
    flex-grow: 1;
    overflow-y: auto;
    padding: 50px;
    background: rgb(246, 243, 219);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    margin-bottom: 10px;
}

/* Scrollbar styling (optional) */
.messages::-webkit-scrollbar {
    width: 8px;
}
.messages::-webkit-scrollbar-thumb {
    background-color: #d1b537;
    border-radius: 5px;
}

/* Input and Button Styling */
.input-container {
    display: flex;
    gap: 10px;
    align-items: center;
}

input, button {
    padding: 12px;
    border-radius: 10px;
    border: 2px solid #a7bd73;
}

input {
    flex-grow: 1;
    font-size: 1em;
}

button {
    background-color: #d1b537;
    color: rgb(251, 249, 222);
    border: none;
    cursor: pointer;
    font-size: 1em;
}

button:hover {
    background-color: #6e691e;
}

/* Chat Messages */
.message {
    background: #d1b537;
    color: rgb(251, 249, 222);
    padding: 10px;
    border-radius: 10px;
    margin: 10px 0;
    max-width: 60%;
    align-self: flex-start;
    text-align: left;
    display: flex;
    flex-direction: column;
}

.message .profile-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 5px;
}

.profile-pic {
    width: 35px;
    height: 35px;
    border-radius: 50%;
}

.username {
    font-weight: bold;
    color: #20441c;
}

.settings-container {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 10px;
}
.game-float-button {
    position: fixed;
    top: 30px;
    right: 20px;
    background: none;
    border: none;
    cursor: pointer;
    z-index: 999;
}

.circle-icon {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    background-color: #4d2c6d;
    padding: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    transition: transform 0.2s ease;
}

.circle-icon:hover {
    transform: scale(1.1);
    background-color: #4d2c6d; 
}

/* Game Popup Styles */
#gamePopup {
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 90vw;
  max-width: 800px;
  height: 100vh;
  background: #fff;
  border-radius: 20px;
  box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
  z-index: 1000;
  overflow: hidden;
  padding: 0;
}

/* Close Button Bar */
.close-btn-bar {
  display: flex;
  justify-content: flex-end;
  background: #364908;
  padding: 10px 20px;
  border-top-left-radius: 20px;
  border-top-right-radius: 20px;
}

.close-btn-bar button {
  font-size: 1.5em;
  background: none;
  border: none;
  cursor: pointer;
}

/* Iframe for Game */
.game-iframe {
  border: none;
  width: 100%;
  height: 100%;
  display: block;
}
@media screen and (max-width: 600px) {
    h1 {
        font-size: 1.5em;
    }
    #gameCanvas {
        width: 60%;
        height: auto;
    }
}


    </style>
</head>
<body>
    <!-- Header Section -->
    <header>
        <h1>The Student Pantry</h1>
    </header>

    <button class="hamburger" onclick="toggleMenu()" aria-label="Toggle navigation menu">☰</button>
<div class="nav-menu" id="navMenu">
    <a href="about.html">Homepge</a>
    <a href="recipes.html">Quick Recipes</a></li>
    <a href="thestudentpantry.html"> Recipe Generator</a></li>
    <a href="studentnotepad.html">Meal Planner</a>
    <a href="studentchat.html"class="active-link">Student Community</a>
   
</div>
<button id="waitGameButton" class="game-float-button" onclick="openGamePopup()">
    <img src="game1.png" alt="Play Game" class="circle-icon">
</button>

<div id="gamePopup">
    <div class="close-btn-bar">
      <button onclick="closeGamePopup()">✖</button>
    </div>

    <iframe src="shark.html" class="game-iframe"></iframe>
  </div>


    
        <!-- Instructions Section -->
<div class="instructions-container">
    <h2 style="margin-bottom: 15px;">Welcome to your Student Community!</h2>
    
    <img src="chat.png" alt="How it works illustration" style="max-width: 100%; border-radius: 10px; margin-bottom: 15px;">
    
</div>

    </div>

    <!-- Chat Container -->
    <div class="chat-container">
        <div class="settings-container">
            <input type="text" id="usernameInput" placeholder="Enter your username...">
            <input type="file" id="profilePicInput" accept="image/*">
            <button onclick="changeUsername()">Set Username</button>
        </div>
        <div class="messages" id="chatMessages"></div>
        <div class="input-container" id="chatInputContainer" style="display: none;">
            <input type="text" id="messageInput" placeholder="Type a message...">
            <input type="file" id="imageInput" accept="image/*">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        let username = "";
        let profilePic = "";

        function changeUsername() {
            let usernameInput = document.getElementById("usernameInput").value.trim();
            let profilePicInput = document.getElementById("profilePicInput");
            if (usernameInput) {
                username = usernameInput;
                if (profilePicInput.files.length > 0) {
                    let reader = new FileReader();
                    reader.onload = function(event) {
                        profilePic = event.target.result;
                    };
                    reader.readAsDataURL(profilePicInput.files[0]);
                }
                document.getElementById("chatInputContainer").style.display = "flex";
            }
        }

        function sendMessage() {
            if (!username) return;

            let messageInput = document.getElementById("messageInput");
            let imageInput = document.getElementById("imageInput");
            let messageText = messageInput.value.trim();
            let chatMessages = document.getElementById("chatMessages");
            let messageElement = document.createElement("div");
            messageElement.classList.add("message");

            let profileHeader = document.createElement("div");
            profileHeader.classList.add("profile-header");

            let profilePicElement = document.createElement("img");
            profilePicElement.classList.add("profile-pic");
            profilePicElement.src = profilePic || "default-profile.png";
            profileHeader.appendChild(profilePicElement);

            let usernameElement = document.createElement("span");
            usernameElement.classList.add("username");
            usernameElement.textContent = username;
            profileHeader.appendChild(usernameElement);

            messageElement.appendChild(profileHeader);

            if (messageText) {
                let textNode = document.createElement("p");
                textNode.textContent = messageText;
                messageElement.appendChild(textNode);
            }

            chatMessages.appendChild(messageElement);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            messageInput.value = "";
            imageInput.value = "";
        }

        function toggleMenu() {
    const menu = document.getElementById("navMenu");
    const hamburger = document.querySelector(".hamburger");

    const isActive = menu.classList.contains("active");
    menu.classList.toggle("active");
    hamburger.setAttribute("aria-expanded", String(!isActive));

    if (!isActive) {
        setTimeout(() => {
            document.addEventListener("click", closeMenuOnClickOutside);
        }, 0);
    } else {
        document.removeEventListener("click", closeMenuOnClickOutside);
    }
}

            function closeMenuOnClickOutside(event) {
                const menu = document.getElementById("navMenu");
                const hamburger = document.querySelector(".hamburger");

                if (!menu.contains(event.target) && !hamburger.contains(event.target)) {
                    menu.classList.remove("active");
                    document.removeEventListener("click", closeMenuOnClickOutside);
                }
            }

            function openGamePopup() {
    document.getElementById('gamePopup').style.display = 'block';
    document.getElementById('overlay').style.display = 'block';
}

function closeGamePopup() {
    document.getElementById('gamePopup').style.display = 'none';
    document.getElementById('overlay').style.display = 'none';
}

    </script>
</body>
</html>
